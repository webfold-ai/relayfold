[package]
name = "relayfold-biota-bench-proxy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
biota-http-server = { path = "../../../biota/http-server" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch."https://github.com/Ptyktos/relayfold.git"]
relayfold = { path = "../.." }

# Keep this benchmark target on the same checked-out ecosystem sources as the
# gateway under test. The public Git revisions can lag the current transport
# API (notably `transport::acme`), which makes a benchmark build lie about the
# code we are measuring.
[patch."https://github.com/Ptyktos/transport"]
transport = { path = "../../../transport" }
[patch."https://gitlab.tas.twn.network/twn/ptyktos/hashtrinity.git"]
hashtrinity = { path = "../../../fold-opsfold-fix/hashtrinity" }
[patch."https://github.com/Ptyktos/modelfold"]
modelfold = { path = "../../../fold-opsfold-fix/modelfold" }
[patch."https://github.com/Ptyktos/sangdb"]
sangdb = { path = "../../../sangdb-fix" }
