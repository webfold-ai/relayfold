[package]
name = "relayfold-convert"
version = "0.1.0"
edition = "2021"
description = "Convert a real, bounded subset of nginx and HAProxy configs into relayfold's own YAML route format — the zentinel-convert gap, filled honestly (two real parsers, not six fake ones)"
license = "Apache-2.0"

[dependencies]
# `codec` for SyntaxTerm/Surface::Yaml (the config format — see the module doc for why not
# serde_yaml).
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "28d875794d4541eb952d23984be411348dc3f1c0", default-features = false, features = ["codec"] }

[lib]
name = "relayfold_convert"
path = "src/lib.rs"

[[bin]]
name = "relayfold-convert"
path = "src/main.rs"
