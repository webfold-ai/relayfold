upstream api_backend {
    server 10.0.1.1:8080 weight=2;
    server 10.0.1.2:8080 weight=1;
    server 10.0.1.3:8080;
}

server {
    listen 80;
    server_name example.com;

    location /api {
        proxy_pass http://api_backend;
    }

    location /static {
        proxy_pass http://127.0.0.1:9001;
    }
}
