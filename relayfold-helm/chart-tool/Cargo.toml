[package]
name = "relayfold-chart-tool"
version = "0.1.0"
edition = "2021"
description = "Rust CLI for relayfold-helm: validates chart/relayfold-proxy/values.yaml against the real schema relayfold-proxy-runtime actually reads (env vars derived from these same keys), and renders typed environment presets — instead of hand-edited YAML or Helm's own Go-template logic for anything beyond plain substitution."
license = "Apache-2.0"

[[bin]]
name = "relayfold-chart-tool"
path = "src/main.rs"

[dependencies]
# `hex`/`base64` are not truly optional despite being listed features: hashtrinity's own
# `crypto.rs` is unconditionally compiled and unconditionally imports both — the same disclosed
# upstream gap relayfold's and relayfold-agents' Cargo.toml already documented.
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "8de00eff38d3ffa5393190c2358a9e54dac5bc2f", default-features = false, features = ["codec", "hex", "base64"] }
