[package]
name = "relayfold-proxy-runtime"
version = "0.1.0"
edition = "2021"
description = "Minimal standalone reverse-proxy binary: servelet's Router and client forwarding through relayfold's load-balancing registry, built so relayfold-helm's chart has something real to deploy."
license = "Apache-2.0"

[lib]
name = "relayfold_proxy_runtime"
path = "src/lib.rs"

[[bin]]
name = "relayfold-proxy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
relayfold = { path = "../../relayfold" }
servelet-core = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "2f54e3bb9ee944dbf69cd5a1b3e540750076e430" }
servelet-router = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "2f54e3bb9ee944dbf69cd5a1b3e540750076e430" }
servelet-h1 = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "2f54e3bb9ee944dbf69cd5a1b3e540750076e430" }
servelet-tls = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "2f54e3bb9ee944dbf69cd5a1b3e540750076e430" }
servelet-client = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "2f54e3bb9ee944dbf69cd5a1b3e540750076e430" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
