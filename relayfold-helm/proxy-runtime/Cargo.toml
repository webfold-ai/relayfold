[package]
name = "relayfold-proxy-runtime"
version = "0.1.0"
edition = "2021"
description = "Minimal standalone reverse-proxy binary: servelet's Router and client forwarding through relayfold's load-balancing registry, built so relayfold-helm's chart has something real to deploy."
license = "Apache-2.0"

[lib]
name = "relayfold_proxy_runtime"
path = "src/lib.rs"

[[bin]]
name = "relayfold-proxy"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
relayfold = { path = "../../relayfold" }
servelet-core = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-router = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-h1 = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-tls = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-client = { version = "0.1.0", git = "https://github.com/Ptyktos/servelet", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
