apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayfold-proxy.fullname" . }}
  labels:
    {{- include "relayfold-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relayfold-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relayfold-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: relayfold-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Every one of these maps 1:1 to a real env var relayfold-proxy-runtime's main.rs reads
          # (env_or calls) — not invented config, the actual runtime surface.
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
            - name: UPSTREAM_HOST
              value: {{ .Values.upstream.host | quote }}
            - name: UPSTREAM_PORT
              value: {{ .Values.upstream.port | quote }}
            - name: UPSTREAM_SCHEME
              value: {{ .Values.upstream.scheme | quote }}
            - name: LOAD_BALANCE
              value: {{ .Values.loadBalance | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
