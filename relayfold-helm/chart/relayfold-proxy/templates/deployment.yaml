apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relayfold-proxy.fullname" . }}
  labels:
    {{- include "relayfold-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "relayfold-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relayfold-proxy.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: relayfold-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The runtime's WHOLE environment surface is two variables: where its config file
          # is, and an override for the listen address. Everything else is in the file —
          # a knob that exists in two places is a knob that will be set in one of them and
          # then be the wrong one. See relayfold-helm/proxy-runtime/README.md for the schema.
          env:
            - name: PROXY_CONFIG
              value: "/etc/relayfold/proxy-runtime.yaml"
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.service.port }}"
          volumeMounts:
            - name: config
              mountPath: /etc/relayfold
              readOnly: true
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "relayfold-proxy.fullname" . }}
            items:
              - key: proxy-runtime.yaml
                path: proxy-runtime.yaml
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
