[package]
name = "relayfold"
version = "0.1.0"
edition = "2021"
description = "Zanzibar-style temporal relationships + Pingora-shaped load-balancing/health core, extracted for real out of bedrock's native_lib.rs"
license = "Apache-2.0"

[dependencies]
# Only `Coord`/`CoordInv`/`CoordMap`/`PHI` are used here (re-exported by wirefold from
# apeiron's table module) — no codec/validate/derive features are needed.
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "ba9a71284844cd1a7f14ae3b7105ad972aaa9e07", default-features = false, features = [] }
