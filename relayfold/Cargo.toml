[package]
name = "relayfold"
version = "0.1.0"
edition = "2021"
description = "Zanzibar-style temporal relationships + Pingora-shaped load-balancing/health core, extracted for real out of bedrock's native_lib.rs"
license = "Apache-2.0"

[dependencies]
# The load-balancing selection logic lives in transport (one home); this crate re-exports it. The
# dependency runs one way: relayfold -> transport. Core only, no tokio or TLS.
transport = { git = "https://github.com/webfold-ai/transport", rev = "b3eb34c3ea8d4eda93543ec645f86d3b275b2eb0", default-features = false }
# Only `Coord`/`CoordInv`/`CoordMap`/`PHI` are used here (re-exported by wirefold from
# apeiron's table module) — no codec/validate/derive features are needed.
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "28d875794d4541eb952d23984be411348dc3f1c0", default-features = false, features = [] }
