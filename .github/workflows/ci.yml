name: ci

on:
  pull_request:
  push:
    branches: [main, 'release/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # relayfold-proxy-runtime depends on biota-http-server, whose own Cargo.toml pulls in
      # modelfold via git; the pinned modelfold commit is missing src/sparse_fft.rs (E0583), a
      # pre-existing external breakage — remove its --exclude once modelfold builds again.
      # relayfold-control no longer touches biota (it serves on servelet), but servelet takes its
      # hashtrinity from the private GitLab mirror (gitlab.tas.twn.network). cargo resolves the WHOLE
      # workspace graph even for excluded members, so these flags do not avoid that fetch; whether
      # this runner has GitLab access is unverified (the last runs never started: billing block).
      # Locally: `cargo test -p relayfold-control` (see relayfold-control/README.md).
      - run: cargo check --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime

  test:
    name: cargo test (workspace, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --exclude relayfold-control --exclude relayfold-proxy-runtime
      # No network tests — the upstream TS repo is git-subtree'd locally
      # for attribution only and is not exercised at runtime.

  fmt:
    name: cargo fmt --all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime -- -D warnings
