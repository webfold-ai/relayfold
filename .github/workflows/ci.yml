name: ci

on:
  pull_request:
  push:
    branches: [main, 'release/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The old reason for these excludes (biota-http-server -> modelfold missing src/sparse_fft.rs,
      # E0583) did not reproduce on 2026-10-11: `cargo test --workspace` was green on the build box,
      # relayfold-control and relayfold-proxy-runtime included. relayfold-control reaches hashtrinity
      # through servelet, which takes it from the private GitLab mirror (gitlab.tas.twn.network), and
      # cargo resolves the WHOLE workspace graph even for excluded members, so the flags do not avoid
      # that fetch. Whether this runner has GitLab access is unverified (the last runs never started:
      # billing block); once it does, both --exclude flags can be dropped.
      - run: cargo check --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime

  test:
    name: cargo test (workspace, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --exclude relayfold-control --exclude relayfold-proxy-runtime
      # No network tests — the upstream TS repo is git-subtree'd locally
      # for attribution only and is not exercised at runtime.

  fmt:
    name: cargo fmt --all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime -- -D warnings
