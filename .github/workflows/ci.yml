name: ci

on:
  pull_request:
  push:
    branches: [main, 'release/**']

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  check:
    name: cargo check (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # relayfold-control and relayfold-proxy-runtime both depend on biota-http-server, whose own
      # Cargo.toml pulls in modelfold via git; the pinned modelfold commit is missing
      # src/sparse_fft.rs (E0583), a pre-existing external breakage. Excluded here until that's
      # fixed upstream — remove the --exclude flags once modelfold builds again.
      - run: cargo check --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime

  test:
    name: cargo test (workspace, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --exclude relayfold-control --exclude relayfold-proxy-runtime
      # No network tests — the upstream TS repo is git-subtree'd locally
      # for attribution only and is not exercised at runtime.

  fmt:
    name: cargo fmt --all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --exclude relayfold-control --exclude relayfold-proxy-runtime -- -D warnings
