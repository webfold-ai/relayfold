name: supply-chain

on:
  pull_request:
    paths:
      - '**/*.toml'
      - '**/*.lock'
      - '**/*.rs'
      - '.github/workflows/supply-chain.yml'
  push:
    branches: [main]
  schedule:
    # Daily: RUSTSEC advisories land throughout the day, and a stale green run hides them.
    - cron: '13 6 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-cargo-audit-action@v2
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny (licences, sources, yanked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked cargo-cyclonedx
      - run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: relayfold-sbom
          path: '**/*.cdx.json'
          retention-days: 90
