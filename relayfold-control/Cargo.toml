[package]
name = "relayfold-control"
version = "0.1.0"
edition = "2021"
description = "A fleet-management control plane for relayfold-based proxy instances: dialkey-signed registry, heartbeat expiry, signed config push, durable append log — built on servelet + sangdb-log, not Elixir/Phoenix"
license = "Apache-2.0"

[dependencies]
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "98df8bfb8051fb24ca43ce3ddc446641684ef8f9", default-features = false, features = ["codec", "derive"] }
# Identity: `transport::dialkey::native_keypair` derives the Ed25519 keypair from a dialkey,
# `transport::signed_dns::{Keypair, PublicKey}` sign/verify. Pinned by rev like the servelet deps.
# 01b1dca is transport on apeiron (Ptyktos/transport#15 and #17, merged): `dialkey::peer_id` returns the PUBLIC key (it returned the
# secret seed up to 30fdaf7). transport itself
# pins relayfold at b50b9e1, not this one: a commit cannot name
# itself. Default features stay on; this crate has not been built with `--no-default-features`.
transport = { git = "https://github.com/Ptyktos/transport", rev = "26dae21cea3305e4e7faf77ab82c77170cfdb8f5" }
# The durable append log (CRC32-framed, fsync policy, torn-tail truncation on open). It is a
# sibling crate inside the sangdb repo; the `sangdb` crate itself is no longer used here.
sangdb-log = { git = "https://github.com/Ptyktos/sangdb", rev = "21101bdc49bc1a0c30dfe65099397c55091960b9" }
# The HTTP kernel is servelet (Ptyktos/servelet), pinned by rev per
# servelet/docs/MIGRATION.md. core/router are the spine; client is the outbound half.
servelet-core = { git = "https://github.com/Ptyktos/servelet.git", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-router = { git = "https://github.com/Ptyktos/servelet.git", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-client = { git = "https://github.com/Ptyktos/servelet.git", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
servelet-h1 = { git = "https://github.com/Ptyktos/servelet.git", rev = "fbaaaadc2d64236f8f2f3079bd9fde2dbd4a52bb" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
