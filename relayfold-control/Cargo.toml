[package]
name = "relayfold-control"
version = "0.1.0"
edition = "2021"
description = "A fleet-management control plane for relayfold-based proxy instances: dialkey-signed registry, heartbeat expiry, signed config push, durable append log — built on servelet + sangdb-log, not Elixir/Phoenix"
license = "Apache-2.0"

[dependencies]
hashtrinity = { git = "https://github.com/Ptyktos/hashtrinity", rev = "2c36b995c82c073c71df7c28b14c62665d62cbf0", default-features = false, features = ["codec", "derive", "hex", "base64"] }
# Identity: `transport::dialkey::native_keypair` derives the Ed25519 keypair from a dialkey,
# `transport::signed_dns::{Keypair, PublicKey}` sign/verify. Pinned by rev like the servelet deps.
# d4745b9 is transport 0.2.0: `dialkey::peer_id` returns the PUBLIC key (it returned the secret seed
# up to 30fdaf7). Default features stay on; this crate has not been built with
# `--no-default-features` (transport 0.2.0 gates `http_client`, but that is not exercised here).
transport = { git = "https://github.com/Ptyktos/transport", rev = "d4745b979cfa0b61d30e310607316309c71f6839" }
# The durable append log (CRC32-framed, fsync policy, torn-tail truncation on open). It is a
# sibling crate inside the sangdb repo; the `sangdb` crate itself is no longer used here.
sangdb-log = { git = "https://github.com/Ptyktos/sangdb", rev = "bb76e6c487e4d33c6d41c57fdc11be36c627bc5e" }
# The HTTP kernel is servelet (Ptyktos/servelet), pinned by rev per
# servelet/docs/MIGRATION.md. core/router are the spine; client is the outbound half.
servelet-core = { git = "https://github.com/Ptyktos/servelet.git", rev = "8b7150ad7873b691442ea5faeeec50f71cc9591f" }
servelet-router = { git = "https://github.com/Ptyktos/servelet.git", rev = "8b7150ad7873b691442ea5faeeec50f71cc9591f" }
servelet-client = { git = "https://github.com/Ptyktos/servelet.git", rev = "8b7150ad7873b691442ea5faeeec50f71cc9591f" }
servelet-h1 = { git = "https://github.com/Ptyktos/servelet.git", rev = "8b7150ad7873b691442ea5faeeec50f71cc9591f" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
