[package]
name = "relayfold-control"
version = "0.1.0"
edition = "2021"
description = "A fleet-management control plane for relayfold-based proxy instances: dialkey-signed registry, heartbeat expiry, signed config push, durable append log — built on servelet + iotadb-log, not Elixir/Phoenix"
license = "Apache-2.0"

[dependencies]
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "28d875794d4541eb952d23984be411348dc3f1c0", default-features = false, features = ["codec", "derive"] }
# Identity: `transport::dialkey::native_keypair` derives the Ed25519 keypair from a dialkey,
# `transport::signed_dns::{Keypair, PublicKey}` sign/verify. Pinned by rev like the servelet deps.
# 841ef57 is transport on apeiron 85b404b, pinning relayfold ef73381 (wirefold 28d8757): `dialkey::peer_id` returns the
# PUBLIC key (it returned the secret seed up to 30fdaf7). transport itself pins relayfold at ef73381, not
# this commit: a commit cannot name itself, and the [patch] in the workspace root maps that pin to the local
# copy, so the graph holds one relayfold. Default features stay on; this crate has not been built with `--no-default-features`.
transport = { git = "https://github.com/Ptyktos/transport", rev = "b3eb34c3ea8d4eda93543ec645f86d3b275b2eb0" }
# The durable append log (CRC32-framed, fsync policy, torn-tail truncation on open): the iotadb-log
# crate in the iotadb repository.
iotadb-log = { git = "https://github.com/webfold-ai/iotadb", rev = "208e6e94a2ad00c226c2030776045f8d465cdb93" }
# The HTTP kernel is servelet (Ptyktos/servelet), pinned by rev per
# servelet/docs/MIGRATION.md. core/router are the spine; client is the outbound half.
servelet-core = { git = "https://github.com/Ptyktos/servelet.git", rev = "47cc623e1b86eb1e1c45f988dda98e81aeae86e2" }
servelet-router = { git = "https://github.com/Ptyktos/servelet.git", rev = "47cc623e1b86eb1e1c45f988dda98e81aeae86e2" }
servelet-client = { git = "https://github.com/Ptyktos/servelet.git", rev = "47cc623e1b86eb1e1c45f988dda98e81aeae86e2" }
servelet-h1 = { git = "https://github.com/Ptyktos/servelet.git", rev = "47cc623e1b86eb1e1c45f988dda98e81aeae86e2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
