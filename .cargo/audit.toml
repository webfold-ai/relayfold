# cargo-audit configuration for relayfold.
#
# cargo-audit reads `.cargo/audit.toml`, not a root-level `audit.toml`.
# The supply-chain workflow (.github/workflows/supply-chain.yml) runs it on every change that
# touches Rust and on a schedule. Anything ignored must be listed here with a reason.

[advisories]
ignore = []

database.source = "https://github.com/rustsec/advisory-db.git"
database.fetch_delay = "time::duration::hours=12"

# Unmaintained-crate notices are project-state advisories, not vulnerabilities: they warn, they
# do not fail. Vulnerabilities still fail the build.
informational_warnings = ["unmaintained", "notice"]
