# cargo-deny configuration for relayfold. Run with: cargo deny check
#
# Licences, banned sources and advisories are checked on every change by the supply-chain workflow
# (.github/workflows/supply-chain.yml), next to cargo-audit (.cargo/audit.toml).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git dependencies are pinned by rev in each member's Cargo.toml.
allow-git = [
    "https://github.com/webfold-ai/wirefold",
    "https://github.com/webfold-ai/apeiron",
    "https://github.com/webfold-ai/iotadb",
    "https://github.com/Ptyktos/servelet",
    "https://github.com/Ptyktos/transport",
]
