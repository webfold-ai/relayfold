[workspace]
resolver = "2"
members = [
    "relayfold",
    "relayfold-convert",
    "relayfold-agents",
    "relayfold-control",
    "relayfold-helm/chart-tool",
    "relayfold-helm/proxy-runtime",
    "relayfold-bench",
]

[patch."https://github.com/Ptyktos/relayfold"]
# `transport` (a direct dep of relayfold-control) still declares `relayfold = { git = "https://github.com/Ptyktos/relayfold" }`. Now
# that relayfold lives locally as a workspace member, that git reference and this path member
# resolve to the same package name and cargo reports "specification `relayfold` is ambiguous"
# without this patch redirecting the git source to the local copy.
relayfold = { path = "relayfold" }
# TEMPORARY: remove this [patch] once transport no longer depends on relayfold (its load_balance
# re-export is being dropped) and relayfold-control is repinned to that transport rev.
