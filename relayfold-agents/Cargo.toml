[package]
name = "relayfold-agents"
version = "0.1.0"
edition = "2021"
description = "A real, crash-isolated external agent protocol + Rust SDK for relayfold-based proxies — the piece zentinel's agent-protocol/agent-rust-sdk cover, ported as an original implementation (not their code) since our proxy shape differs"
license = "Apache-2.0"

[dependencies]
# `codec` for SyntaxTerm/Surface::Json (the wire format — see WHY-NOT-SERDE_JSON in lib.rs).
# Request/response bodies travel as JSON-safe base64 strings.
wirefold = { version = "0.1.0", git = "https://github.com/webfold-ai/wirefold", rev = "e4fde11d9e7258ab017d0427024d7c272daa26f2", default-features = false, features = ["codec"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
